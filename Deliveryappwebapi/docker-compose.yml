version: '3.8'

services:
  webapi:
    image: ${DOCKER_REGISTRY-}deliveryapi
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5287:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=db;Port=3306;Database=DeliveryAppDb;User=root;Password=Root@12345;
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.0
    container_name: delivery_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: Root@12345
      MYSQL_DATABASE: DeliveryAppDb
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin" ,"ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

volumes:
  db_data:
